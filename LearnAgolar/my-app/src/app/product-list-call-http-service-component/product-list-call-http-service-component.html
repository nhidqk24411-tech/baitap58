<p>product-list-component works!</p>
<table border = "1">
    <thead>
        <tr>
            <td>ID</td>
            <td>Name</td>
            <td>Price</td>
        </tr>
    </thead>
    <tbody>
        @for (p of products(); track p.id) {
            <!-- @if : thêm vài sản phẩm và nhập giá âm, dùng if để sản phẩm nào cso giá <0 thì hiển thị tô đỏ -->
            @if (p.price < 0) {
                <tr class="negative-price">
                    <td>{{p.id}}</td>
                    <td>{{p.name}}</td>
                    <td>{{p.price}}</td>
                    <td><img [src] = "p.image" [alt] = "p.name" width = "100" height = "100"></td>

                </tr>
            } @else {
                <tr>
                    <td>{{p.id}}</td>
                    <td>
                        <a [routerLink]="['/product', p.id]" target="_blank">
                        {{p.name}}
                        </a>
                    </td>
                    <td>{{p.price}}</td>
                    <td>
                        <a [routerLink]="['/product', p.id]">
                            <img [src] = "p.image" [alt] = "p.name" width = "100" height = "100">
                        </a>
                    </td>
                </tr>
            }
        }
        @empty {
            <tr>
                <td colspan = "4">No product available</td>
            </tr>
        }
    </tbody>
</table>
