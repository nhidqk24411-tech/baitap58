<p>product-list-advanced-component works!</p>
{{ errMessage() }}
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Image</th>
      <th>Name</th>
      <th>Price</th>
      <th>Details</th>
      <th>Slug</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>
          <img [src]="p.image" [alt]="p.name" width="80" height="80" />
        </td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }}</td>
        <td>
          <a [routerLink]="['/product', p.id]" title="click here to view detail">
            View detail
          </a>
        </td>
        <td>
          <a (click)="viewDetailSlug(p)" style="cursor: pointer;" title="click here to view detail">
            {{ generateSlug(p.name, p.id) }}
          </a>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="6">No products available.</td>
      </tr>
    }
  </tbody>
</table>

<router-outlet><router-outlet />
