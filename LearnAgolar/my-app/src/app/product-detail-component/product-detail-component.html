<p>product-detail-component works!</p>
<p>
  {{errMessage()}}
</p>
<table border="1">
  @if (product() !== null) {
    <tr>
      <td>Product ID:</td>
      <td>{{ product()?.id }}</td>
    </tr>
    <tr>
      <td>Product Image:</td>
      <td>
        <img [src]="product()?.image" [alt]="product()?.name" width="160" height="160" />
      </td>
    </tr>
    <tr>
      <td>Product Name:</td>
      <td>{{ product()?.name }}</td>
    </tr>
    <tr>
      <td>Price:</td>
      <td>{{ product()?.price }}</td>
    </tr>
  } @else {
    <tr>
      <td colspan="2">Cannot find the product</td>
    </tr>
}
</table>
<button (click)="goBack()">
  Go Back
</button>
